name: Python check

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.9.3" "flake8>=7,<8" "pytest>=8,<9"

      - name: Compile integration
        run: python -m compileall -q custom_components/mojelektro

      - name: Regression check empty API payloads
        run: |
          python - <<'PY'
          import json

          from custom_components.mojelektro.const import (
              SETUP_TAG_15_ARRAY,
              SETUP_TAG_BLOCKS_ARRAY,
          )
          from custom_components.mojelektro.moj_elektro_api import MojElektroApi

          api = MojElektroApi("test-token", "test-meter", 4, None)

          assert api.sensors_output([], json.loads(SETUP_TAG_15_ARRAY)) == {}
          assert api.consumption_by_block([], json.loads(SETUP_TAG_BLOCKS_ARRAY)) == {}
          PY

      - name: Run tariff regression tests
        run: python -m pytest -q tests/test_tariff.py

      - name: Check for Python errors
        run: |
          flake8 custom_components/mojelektro \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
