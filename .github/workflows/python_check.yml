name: Python check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.9.3" "flake8>=7,<8" "pytest>=8,<9"

      - name: Compile integration
        run: python -m compileall -q custom_components/mojelektro

      - name: Run regression tests
        run: python -m pytest -q tests

      - name: Check for Python errors
        run: |
          flake8 custom_components/mojelektro \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
