name: Moj Elektro API schema check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install YAML parser
        run: python -m pip install "PyYAML>=6,<7"

      - name: Validate official Moj Elektro OpenAPI contract
        run: python scripts/check_api_schema.py
