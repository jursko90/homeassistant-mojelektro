name: Moj Elektro API schema check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/check_api_schema.py"
      - ".github/workflows/api_schema_check.yml"
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install YAML parser
        run: python -m pip install "PyYAML>=6,<7"

      - name: Validate official Moj Elektro OpenAPI contract
        run: python scripts/check_api_schema.py
